build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 15
    constructorThreshold: 15
    ignoreDataClasses: true
    ignoreAnnotated:
      - 'Composable'
  LongMethod:
    active: true
    threshold: 300
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: true
    thresholdInFiles: 60

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '.*'
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: false

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 160
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - 'Composable'

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
